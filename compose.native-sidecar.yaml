# The native sidecar (EXIT_KIND=sidecar, TUNNEL_BACKEND=native). EXPERIMENTAL;
# see docs/native-sidecar.md, and docs/testing.md for what was tested.
#
# Use this file instead of compose.yaml, not on top of it:
#   COMPOSE_FILE=compose.native-sidecar.yaml   (in .env, from .env.native-sidecar.example)
#
# Molebridge's own exit brings up a Mullvad, PIA or NordVPN WireGuard tunnel in
# its network namespace, and your applications join that namespace
# (`network_mode: service:exit`) and send their own traffic through it. Unlike
# the gluetun sidecar, Molebridge keeps that traffic in the tunnel itself: a
# routing contract and an nftables firewall (table inet molebridge_sidecar),
# both installed before the tunnel exists and left in place while the exit
# restarts. Only SIDECAR_LAN_CIDRS, loopback and the exit's own marked
# connections reach anything outside the tunnel. There is no NetBird.
#
# Namespace ownership: `exit` creates the namespace. Every application joins
# it. If `exit` is recreated, the others can remain in its old namespace:
# recreate them together (`docker compose up -d --force-recreate`, then the
# attachment check in docs/operations.md).
#
# Secrets live in the mode-0600 files under ./tunnel and ./secrets; never print
# them or paste `docker compose config` output anywhere.
name: molebridge-native-sidecar

services:
  exit:
    image: ghcr.io/irashack/molebridge:v0.8.0@sha256:aa882618115e602c554901a9b5e7d504068499da6da0ff921bf40cd39767e52a
    # Only for people who build from a checkout, with a local image name in
    # compose.override.yaml (CONTRIBUTING.md#building-the-image); the release
    # bundle has no Dockerfile and pulls the image instead.
    build:
      context: .
      dockerfile: Dockerfile
    command: ["exit"]
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge-native-sidecar}-exit"
    restart: unless-stopped
    cap_drop: [ALL]
    # NET_ADMIN: the routing contract, the firewall and the tunnel.
    # NET_RAW: binding egress checks to the tunnel on kernels before 5.7.
    # DAC_OVERRIDE: reads the mode-0600 tunnel config, credential files and
    # panel requests, and writes state directories your host user owns
    # (rootful Docker; a rootless engine's container root is that user already).
    # The applications get none of these: without NET_ADMIN they can neither
    # change the rules nor mark a socket past the firewall.
    cap_add: [NET_ADMIN, NET_RAW, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      # The supervisor's runtime files.
      - /run:size=4m,mode=0755,noexec,nosuid,nodev
    # The stop sequence removes the tunnel within 13 seconds; the rules and
    # the firewall stay.
    stop_grace_period: 15s
    # Publish your applications' ports here: they listen in this namespace.
    # A published port arrives from the engine's network, so name that
    # network in SIDECAR_LAN_CIDRS or the replies are dropped.
    # ports:
    #   - "127.0.0.1:8080:8080"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      EXIT_KIND: sidecar
      TUNNEL_BACKEND: native
      PROVIDER: "${PROVIDER:-pia}"
      EXIT_IF: "${EXIT_IF:-pia}"
      EXIT_TABLE: "${EXIT_TABLE:-51821}"
      HOST_IF: "${HOST_IF:-eth0}"
      # Where the applications may go outside the tunnel, comma-separated:
      # the engine's network for published ports and neighbours, a resolver
      # (docs/native-sidecar.md#dns). Everything else goes through the tunnel
      # or nowhere.
      SIDECAR_LAN_CIDRS: "${SIDECAR_LAN_CIDRS:-}"
      # The exit's own lookups, when the namespace's resolvers are reachable
      # only through the tunnel (docs/native-sidecar.md#dns).
      SIDECAR_HOST_RESOLVERS: "${SIDECAR_HOST_RESOLVERS:-}"
      SERVER: "${SERVER:-}"
      # PIA only, off by default: the forwarded port reaches this namespace;
      # port-sync below tells qBittorrent which one it is.
      PIA_PORT_FORWARD: "${PIA_PORT_FORWARD:-off}"
      GATUS_URL: "${GATUS_URL:-}"
      GATUS_ENDPOINT: "${GATUS_ENDPOINT:-molebridge}"
      STATE_DIR: /state
      ROUTING_RECONCILE_INTERVAL: "${ROUTING_RECONCILE_INTERVAL:-30}"
      GUARD_GRACE: "${GUARD_GRACE:-30}"
    env_file:
      # Optional GATUS_TOKEN for health pushes.
      - path: ./secrets/applier.env
        required: false
    volumes:
      # wg_confs/<EXIT_IF>.conf holds the tunnel private key (mode 0600).
      - ./tunnel/wg_confs:/config/wg_confs:ro
      - ./state/panel:/state/panel:ro
      - ./state/applier:/state/applier
      # PIA only: secrets/pia/username and secrets/pia/password, mode 0600.
      # Create the directory for every provider (docs/setup.md).
      - type: bind
        source: ./secrets/pia
        target: /run/secrets/pia
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/molebridge", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
    deploy:
      resources:
        limits:
          memory: 512m

  example-app:
    # A stand-in for your application: it only sleeps, in the exit's
    # namespace. It runs only with COMPOSE_PROFILES=example (as
    # .env.native-sidecar.example sets it). Add your own services in a file of
    # your own, each with `network_mode: service:exit`, and give them no
    # capabilities.
    profiles: [example]
    image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge-native-sidecar}-example-app"
    # Not restarted by the engine: after a reboot the engine starts
    # unless-stopped containers without waiting for depends_on, so an
    # application could run before the exit has installed its firewall and
    # rules, with the host's routes open to it. Start the stack at boot with
    # `docker compose up -d`, which waits for the exit to be healthy
    # (docs/native-sidecar.md#starting-at-boot). Give your applications the
    # same policy.
    restart: "no"
    network_mode: service:exit
    init: true
    command: ["sleep", "2147483647"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    depends_on:
      exit:
        # Starts once the tunnel is verified; restarted when Compose restarts
        # or recreates the exit.
        condition: service_healthy
        restart: true
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 16m

  port-sync:
    # Keeps qBittorrent's listening port on PIA's forwarded port
    # (docs/native-sidecar.md#port-forwarding). It runs only with
    # COMPOSE_PROFILES=port-sync. No capabilities, nothing written: it reads
    # the exit's record and calls qBittorrent's Web API on the namespace's
    # loopback with the login in ./secrets/port-sync.
    profiles: [port-sync]
    image: ghcr.io/irashack/molebridge:v0.8.0@sha256:aa882618115e602c554901a9b5e7d504068499da6da0ff921bf40cd39767e52a
    command: ["port-sync"]
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge-native-sidecar}-port-sync"
    restart: unless-stopped
    network_mode: service:exit
    user: "${PANEL_USER:-1000:1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      STATE_DIR: /state
      PORT_SYNC_CLIENT: qbittorrent
      PORT_SYNC_URL: "${PORT_SYNC_URL:-http://127.0.0.1:8080}"
      PORT_SYNC_USERNAME_FILE: /run/secrets/port-sync/username
      PORT_SYNC_PASSWORD_FILE: /run/secrets/port-sync/password
    volumes:
      - ./state/applier:/state/applier:ro
      - type: bind
        source: ./secrets/port-sync
        target: /run/secrets/port-sync
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      exit:
        condition: service_started
        restart: true
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 32m

  switchyard:
    # compose.yaml's panel, repeated here rather than extended: extending it
    # would make Compose resolve compose.yaml's overlay settings too.
    image: ghcr.io/irashack/molebridge:v0.8.0@sha256:aa882618115e602c554901a9b5e7d504068499da6da0ff921bf40cd39767e52a
    command: ["panel"]
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge-native-sidecar}-switchyard"
    restart: unless-stopped
    # The user that owns ./state/panel, as the container sees it: your host
    # user's uid:gid on Docker. Under a rootless engine that remaps uids, set
    # PANEL_USER=0:0 and PANEL_ALLOW_ROOT=1 beside it (docs/configuration.md).
    user: "${PANEL_USER:-1000:1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      STATE_DIR: /state
      PROVIDER: "${PROVIDER:-pia}"
      # A single-exit panel reads the kind from here.
      EXIT_KIND: sidecar
      PANEL_ALLOW_ROOT: "${PANEL_ALLOW_ROOT:-}"
      PANEL_EXITS: "${PANEL_EXITS:-}"
      PANEL_PUBLIC_HOSTS: "${PANEL_PUBLIC_HOSTS:-}"
      PANEL_FRAME_ANCESTORS: "${PANEL_FRAME_ANCESTORS:-}"
      PANEL_TITLE: "${PANEL_TITLE:-Switchyard}"
      PANEL_SHORT_TITLE: "${PANEL_SHORT_TITLE:-Switchyard}"
      PANEL_HOST_LABEL: "${PANEL_HOST_LABEL:-this tunnel}"
      PANEL_HOME_URL: "${PANEL_HOME_URL:-}"
      PANEL_HOME_LABEL: "${PANEL_HOME_LABEL:-Home}"
      PANEL_THEME: "${PANEL_THEME:-auto}"
      PANEL_STYLE: "${PANEL_STYLE:-provider}"
      PANEL_OIDC_ISSUER: "${PANEL_OIDC_ISSUER:-}"
      PANEL_OIDC_CLIENT_ID: "${PANEL_OIDC_CLIENT_ID:-}"
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:-}"
      PANEL_ADMIN_GROUPS: "${PANEL_ADMIN_GROUPS:-}"
      PANEL_SESSION_TTL: "${PANEL_SESSION_TTL:-3600}"
    ports:
      # Loopback only. Publish it through an authenticating proxy, or turn on
      # sign-in (docs/access.md).
      - "127.0.0.1:${PANEL_PORT:-8095}:8080"
    volumes:
      - ./state/panel:/state/panel
      - ./state/applier:/state/applier:ro
    networks: [panel]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  panel:
