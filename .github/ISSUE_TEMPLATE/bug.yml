name: Bug report
description: The exit, the panel or a tool does something other than the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Leave out real keys, account numbers, hostnames, public addresses and
        peer IDs; describe a secret by its file and field name only. A
        suspected fail-open or other vulnerability goes to the private route
        in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Release
      description: The image tag or digest, or the commit for a source build.
      placeholder: v0.9.3
    validations:
      required: true
  - type: dropdown
    id: form
    attributes:
      label: Form
      options:
        - Native exit (compose.yaml)
        - gluetun exit (compose.gluetun.yaml)
        - Sidecar (compose.sidecar.yaml)
        - Native sidecar (compose.native-sidecar.yaml)
        - Kubernetes
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Mullvad, PIA, NordVPN, "gluetun (say which provider below)"]
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Host and container runtime
      placeholder: Debian 13, Docker 29 / rootless Podman 5.6 / k0s 1.34
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The smallest steps that reproduce it.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: molebridge status
      description: >-
        `molebridge status` in the exit container
        (docs/operations.md#health), with public addresses removed.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Exit log
      description: The exit container's log around the problem, redacted as above.
      render: text
