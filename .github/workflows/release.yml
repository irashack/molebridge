name: Release

# One dispatch table. Nothing on a branch push publishes (CI builds and tests).
#   workflow_dispatch   a signing rehearsal against a throwaway package
#                       (ghcr.io/irashack/molebridge-ci), never the release one
#   tag v*-rc.*         build, push, sign and attest a release candidate
#   tag v* (no -rc)     promote the accepted candidate for the same commit,
#                       without rebuilding; also move the floating minor tag
#                       (`:0.10`, no v), a mutable pull convenience the
#                       Compose files never use (docs/setup.md, "Which tags
#                       exist")
# The jobs' `if:` conditions are mutually exclusive. Each job has the
# permissions it uses and no others.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/irashack/molebridge
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  rehearsal:
    name: Signing rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REHEARSAL_IMAGE: ghcr.io/irashack/molebridge-ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, push, sign and attest to the throwaway package
        id: pub
        uses: ./.github/actions/publish-image
        with:
          image: ${{ env.REHEARSAL_IMAGE }}
          tag: rehearsal-${{ github.run_id }}
      - name: Bundle, signed and attested (once the Compose files name the image)
        id: bundle
        env:
          DIGEST: ${{ steps.pub.outputs.digest }}
        run: |
          set -euo pipefail
          if ! grep -q 'ghcr.io/irashack/molebridge' compose.yaml; then
            echo "The Compose files do not reference the image yet; no bundle."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) sh tools/make-bundle.sh v0.0.0-rc.0 "$DIGEST" dist
          cosign sign-blob --yes --bundle dist/molebridge-v0.0.0-rc.0.tar.gz.sigstore.json dist/molebridge-v0.0.0-rc.0.tar.gz
      - name: Attest the rehearsal bundle
        if: steps.bundle.outputs.built == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/molebridge-v0.0.0-rc.0.tar.gz
      - name: Write a synthetic live-acceptance predicate for the rehearsal digest
        env:
          DIGEST: ${{ steps.pub.outputs.digest }}
        run: |
          set -euo pipefail
          jq '{platforms, providers, kinds, drills: (.drills | map({id: ., result: "passed"}))}' tools/acceptance-policy.json > coverage.json
          echo '["rehearsal"]' > evidence.json
          # The predicate writer wants a candidate tag and a bundle name; the
          # values are placeholders for the rehearsal.
          sh tools/make-acceptance-predicate.sh --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --tag v0.0.0-rc.0 --image "$REHEARSAL_IMAGE" --digest "$DIGEST" \
            --bundle-name molebridge-v0.0.0-rc.0.tar.gz --bundle-sha256 "$(printf '0%.0s' $(seq 1 64))" \
            --coverage coverage.json --evidence evidence.json > predicate.json
      - name: Attest the synthetic predicate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REHEARSAL_IMAGE }}
          subject-digest: ${{ steps.pub.outputs.digest }}
          predicate-type: https://github.com/irashack/molebridge/attestations/live-acceptance/v1
          predicate-path: predicate.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify what was signed and attested, with the promotion policy
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.pub.outputs.digest }}
          AMD64: ${{ steps.pub.outputs.amd64 }}
          ARM64: ${{ steps.pub.outputs.arm64 }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" \
            --certificate-github-workflow-sha "$GITHUB_SHA" "$REHEARSAL_IMAGE@$DIGEST" >/dev/null
          gh attestation verify "oci://$REHEARSAL_IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$identity" --cert-oidc-issuer "$OIDC_ISSUER" \
            --source-digest "$GITHUB_SHA" --predicate-type https://slsa.dev/provenance/v1 --format json > provenance.json
          sh tools/verify-acceptance.sh provenance --results provenance.json --repo "$GITHUB_REPOSITORY" \
            --identity "$identity" --issuer "$OIDC_ISSUER" --digest "$DIGEST" --commit "$GITHUB_SHA" --image "$REHEARSAL_IMAGE"
          gh attestation verify "oci://$REHEARSAL_IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$identity" --cert-oidc-issuer "$OIDC_ISSUER" \
            --predicate-type https://github.com/irashack/molebridge/attestations/live-acceptance/v1 --format json > acceptance.json
          sh tools/verify-acceptance.sh acceptance --results acceptance.json --repo "$GITHUB_REPOSITORY" \
            --identity "$identity" --issuer "$OIDC_ISSUER" --digest "$DIGEST" --commit "$GITHUB_SHA" --image "$REHEARSAL_IMAGE"
          # The policy must refuse the same material under another identity.
          if sh tools/verify-acceptance.sh acceptance --results acceptance.json --repo "$GITHUB_REPOSITORY" \
            --identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/acceptance.yml@refs/heads/main" \
            --issuer "$OIDC_ISSUER" --digest "$DIGEST" --commit "$GITHUB_SHA" --image "$REHEARSAL_IMAGE" >/dev/null 2>&1; then
            echo "::error::the policy accepted the wrong identity"
            exit 1
          fi
          for manifest in "$AMD64" "$ARM64"; do
            gh attestation verify "oci://$REHEARSAL_IMAGE@$manifest" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$identity" --cert-oidc-issuer "$OIDC_ISSUER" \
              --predicate-type https://spdx.dev/Document/v2.3 >/dev/null
          done
          echo "Rehearsal verified: signature, provenance, acceptance policy, both SBOMs." >> "$GITHUB_STEP_SUMMARY"

  candidate:
    name: Release candidate
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' ||
            { echo "::error::$GITHUB_REF_NAME is not a candidate tag like v0.8.0-rc.1"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::the tagged commit is not on main"; exit 1; }
      - name: Build, push, sign and attest the image
        id: pub
        uses: ./.github/actions/publish-image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.ref_name }}
      - name: Build and sign the bundle
        env:
          DIGEST: ${{ steps.pub.outputs.digest }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) sh tools/make-bundle.sh "$GITHUB_REF_NAME" "$DIGEST" dist
          cosign sign-blob --yes --bundle "dist/molebridge-$GITHUB_REF_NAME.tar.gz.sigstore.json" "dist/molebridge-$GITHUB_REF_NAME.tar.gz"
          sha256sum "dist/molebridge-$GITHUB_REF_NAME.tar.gz" | tee "$RUNNER_TEMP/bundle.sha256"
      - name: Attest the bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/molebridge-${{ github.ref_name }}.tar.gz
      - name: Release notes
        env:
          DIGEST: ${{ steps.pub.outputs.digest }}
          AMD64: ${{ steps.pub.outputs.amd64 }}
          ARM64: ${{ steps.pub.outputs.arm64 }}
        run: |
          sh tools/release-notes.sh --kind candidate --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --digest "$DIGEST" --amd64 "$AMD64" --arm64 "$ARM64" > release-notes.md
      - name: Upload the bundle and SBOMs as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.sigstore.json
            dist/*.spdx.json
            release-notes.md
          if-no-files-found: error
      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME (release candidate)" --notes-file release-notes.md \
            dist/*.tar.gz dist/*.sigstore.json dist/*.spdx.json

  promote:
    name: Promote the accepted candidate
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-rc')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' ||
            { echo "::error::$GITHUB_REF_NAME is not a release tag like v0.8.0"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::the tagged commit is not on main"; exit 1; }
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install cosign and crane
        uses: ./.github/actions/install-release-tools
        with:
          cosign: "true"
          crane: "true"
      - name: Find the accepted candidate for this commit
        id: rc
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          wf="https://github.com/${GITHUB_REPOSITORY}/.github/workflows"
          accept_type=https://github.com/irashack/molebridge/attestations/live-acceptance/v1
          found=
          # Highest candidate number first; the first one that passes every
          # check is the one promoted. A candidate tag that does not point at
          # this commit is never considered.
          for rc in $(git tag --points-at "$GITHUB_SHA" --list "${TAG}-rc.*" | sort -V -r); do
            echo "Considering $rc"
            digest=$(crane digest "$IMAGE:$rc") || { echo "  no image for $rc"; continue; }
            build_id="$wf/release.yml@refs/tags/$rc"
            cosign verify --certificate-identity "$build_id" --certificate-oidc-issuer "$OIDC_ISSUER" \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$IMAGE@$digest" >/dev/null ||
              { echo "  the image signature does not verify for $rc"; continue; }
            gh attestation verify "oci://$IMAGE@$digest" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$build_id" --cert-oidc-issuer "$OIDC_ISSUER" \
              --source-digest "$GITHUB_SHA" --predicate-type https://slsa.dev/provenance/v1 \
              --format json > provenance.json ||
              { echo "  no verifiable build provenance for $rc"; continue; }
            sh tools/verify-acceptance.sh provenance --results provenance.json --repo "$GITHUB_REPOSITORY" \
              --identity "$build_id" --issuer "$OIDC_ISSUER" --digest "$digest" --commit "$GITHUB_SHA" --image "$IMAGE" ||
              continue
            gh attestation verify "oci://$IMAGE@$digest" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$wf/acceptance.yml@refs/heads/main" --cert-oidc-issuer "$OIDC_ISSUER" \
              --predicate-type "$accept_type" --format json > acceptance.json ||
              { echo "  no verifiable acceptance attestation for $rc"; continue; }
            sh tools/verify-acceptance.sh acceptance --results acceptance.json --repo "$GITHUB_REPOSITORY" \
              --identity "$wf/acceptance.yml@refs/heads/main" --issuer "$OIDC_ISSUER" --digest "$digest" \
              --commit "$GITHUB_SHA" --image "$IMAGE" --predicate-type "$accept_type" ||
              continue
            found=$rc
            break
          done
          if [ -z "$found" ]; then
            echo "::error::no accepted release candidate for $TAG at $GITHUB_SHA; run live acceptance (acceptance.yml) for a candidate of this commit"
            exit 1
          fi
          echo "rc=$found" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Promote by digest and sign
        env:
          TAG: ${{ github.ref_name }}
          RC: ${{ steps.rc.outputs.rc }}
          DIGEST: ${{ steps.rc.outputs.digest }}
        run: |
          set -euo pipefail
          # A release tag is immutable: absent, or already this digest.
          if existing=$(crane digest "$IMAGE:$TAG" 2>/dev/null) && [ "$existing" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$TAG already exists with a different digest"
            exit 1
          fi
          crane copy "$IMAGE@$DIGEST" "$IMAGE:$TAG"
          minor=${TAG#v}
          minor=${minor%.*}
          highest=$(git tag --list "v${minor}.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$highest" = "$TAG" ]; then
            crane copy "$IMAGE@$DIGEST" "$IMAGE:$minor"
          else
            echo "$IMAGE:$minor stays where it is: $highest is newer than $TAG"
          fi
          cosign sign --yes "$IMAGE@$DIGEST"
          [ "$(crane digest "$IMAGE:$TAG")" = "$DIGEST" ] || { echo "::error::release tag digest differs from the candidate"; exit 1; }
          if [ "$highest" = "$TAG" ]; then
            [ "$(crane digest "$IMAGE:$minor")" = "$DIGEST" ] || { echo "::error::floating tag digest differs from the candidate"; exit 1; }
          fi
          cosign verify --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "$OIDC_ISSUER" --certificate-github-workflow-sha "$GITHUB_SHA" "$IMAGE@$DIGEST" >/dev/null
          echo "Promoted $RC to $TAG: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and sign the bundle
        env:
          DIGEST: ${{ steps.rc.outputs.digest }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) sh tools/make-bundle.sh "$GITHUB_REF_NAME" "$DIGEST" dist
          cosign sign-blob --yes --bundle "dist/molebridge-$GITHUB_REF_NAME.tar.gz.sigstore.json" "dist/molebridge-$GITHUB_REF_NAME.tar.gz"
      - name: Attest the bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/molebridge-${{ github.ref_name }}.tar.gz
      - name: Fetch the candidate's SBOMs and write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.rc.outputs.rc }}
          DIGEST: ${{ steps.rc.outputs.digest }}
        run: |
          set -euo pipefail
          gh release download "$RC" --pattern 'sbom-*.spdx.json' --dir dist
          crane manifest "$IMAGE@$DIGEST" > index.json
          amd64=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' index.json)
          arm64=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' index.json)
          sh tools/release-notes.sh --kind release --tag "$GITHUB_REF_NAME" --build-tag "$RC" --commit "$GITHUB_SHA" \
            --digest "$DIGEST" --amd64 "$amd64" --arm64 "$arm64" > release-notes.md
      - name: Upload the bundle as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.sigstore.json
            dist/*.spdx.json
            release-notes.md
          if-no-files-found: error
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md dist/*.tar.gz dist/*.sigstore.json dist/*.spdx.json
