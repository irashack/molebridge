name: Drill image

# On demand only: the image with NetBird built with the `drill` tag, for
# live measurements and drills that need its hooks (MOLEBRIDGE_DRILL_*, such
# as the failover timings). It goes to the throwaway package
# ghcr.io/irashack/molebridge-ci as drill-<commit>-<run id>, unsigned and
# never released or promoted; its binary reports that tag. The digest is in
# the run's summary. Use it by digest.

on:
  workflow_dispatch:

permissions: {}

jobs:
  drill-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/irashack/molebridge-ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the tag
        id: tag
        run: echo "tag=drill-${GITHUB_SHA::12}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            GO_TAGS=drill
      - name: Check the binary and write the summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          got=$(docker run --rm --network none --platform linux/amd64 "$IMAGE@$DIGEST" version)
          [ "$got" = "molebridge $TAG" ] || { echo "::error::the image says '$got', want 'molebridge $TAG'"; exit 1; }
          {
            echo "Drill image (not a release): \`$IMAGE:$TAG\`"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST"
