name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Shell scripts
        run: |
          for script in routing/10-exit-routing routing/wait-for-guards applier/apply.sh tools/check-routing.sh; do sh -n "$script"; done
          shellcheck -S warning routing/10-exit-routing routing/wait-for-guards applier/apply.sh tools/check-routing.sh
      - name: Compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Python tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest==9.1.1 PyYAML==6.0.3
          .venv/bin/python -m pytest -q panel tools
      - name: Build the privileged applier
        run: docker build --tag molebridge-applier:ci --file applier/Dockerfile .
      - name: Check runtime tools in the applier image
        run: docker run --rm --network none --entrypoint sh molebridge-applier:ci -c 'python --version && wg --version && ip -Version && curl --version'
      - name: Build the routing image and check init ownership
        run: |
          docker build --tag molebridge-wireguard:ci --file routing/Dockerfile .
          docker run --rm --network none --entrypoint sh molebridge-wireguard:ci -c 'test -x /custom-cont-init.d/10-exit-routing && test "$(stat -c %u /custom-cont-init.d/10-exit-routing)" = 0'
      - name: Linux namespace routing drills
        run: sudo sh tools/check-routing.sh
