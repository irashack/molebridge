name: Install release tools
description: >
  Installs cosign, syft, crane and grype (linux/amd64 runners) from their
  GitHub release assets, each verified against a SHA-256 committed here. To
  update a tool, change its version and checksum together: the checksum is
  the linux_amd64 line of the release's checksums file (cosign_checksums.txt,
  syft_<version>_checksums.txt, go-containerregistry's checksums.txt,
  grype_<version>_checksums.txt).

inputs:
  cosign:
    description: Install cosign
    default: "false"
  syft:
    description: Install syft
    default: "false"
  crane:
    description: Install crane
    default: "false"
  grype:
    description: Install grype (the scheduled image scan)
    default: "false"

runs:
  using: composite
  steps:
    - name: Install tools
      shell: bash
      env:
        WANT_COSIGN: ${{ inputs.cosign }}
        WANT_SYFT: ${{ inputs.syft }}
        WANT_CRANE: ${{ inputs.crane }}
        WANT_GRYPE: ${{ inputs.grype }}
        COSIGN_VERSION: v3.1.3
        COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        SYFT_VERSION: v1.54.1
        SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
        CRANE_VERSION: v0.22.1
        CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        GRYPE_VERSION: v0.120.1
        GRYPE_SHA256: 0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/release-tools/bin"
        mkdir -p "$bin" "$RUNNER_TEMP/release-tools/dl"
        cd "$RUNNER_TEMP/release-tools/dl"
        if [ "$WANT_COSIGN" = true ]; then
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          install -m 0755 cosign "$bin/cosign"
        fi
        if [ "$WANT_SYFT" = true ]; then
          archive="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" syft
          install -m 0755 syft "$bin/syft"
        fi
        if [ "$WANT_CRANE" = true ]; then
          archive="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${archive}"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" crane
          install -m 0755 crane "$bin/crane"
        fi
        if [ "$WANT_GRYPE" = true ]; then
          archive="grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/${archive}"
          echo "${GRYPE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" grype
          install -m 0755 grype "$bin/grype"
        fi
        echo "$bin" >> "$GITHUB_PATH"
