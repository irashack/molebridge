# Base-image digests for the images Molebridge builds itself, and Go modules.
# A pull request here is a prompt, not a release: rebuild, run
# docs/verification.md, then merge (CONTRIBUTING.md). The NetBird client pin in
# the root Dockerfile is a release URL and checksums, not an image, so
# Dependabot cannot bump it; it is updated by hand with the checksums file of
# the release (see the comment above NETBIRD_VERSION in the Dockerfile).
version: 2
updates:
  # The single image (golang and alpine digests).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(image)"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(go)"
  # The older routing and applier images, until their Dockerfiles go.
  - package-ecosystem: docker
    directory: /routing
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(routing)"
  - package-ecosystem: docker
    directory: /applier
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(applier)"
