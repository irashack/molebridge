# Molebridge: a Mullvad, PIA or NordVPN WireGuard exit node for a NetBird
# overlay, with a web panel for choosing the server (Mullvad, NordVPN) or
# region (PIA).
#
# Run from the repository root after following docs/setup.md:
#   docker compose up -d
#
# For PIA, set PROVIDER=pia and EXIT_IF=pia in .env and add compose.pia.yaml
# (COMPOSE_FILE=compose.yaml:compose.pia.yaml); for NordVPN, nordvpn and
# compose.nordvpn.yaml the same way. See docs/providers.md.
#
# Namespace ownership: `wireguard` creates the network namespace and the
# provider tunnel. `netbird` and `applier` join it (`network_mode:
# service:wireguard`) and share its interfaces and routing. If `wireguard`
# is recreated, those two can remain in its old namespace: its owner record
# (exit-run volume) then no longer matches, NetBird's gate stops NetBird and
# the applier reports routing as unsafe. Recreate all four together:
# tools/molebridge.py recover on Docker, or the Podman commands in
# docs/operations.md. `control-panel`
# runs on its own network with no capabilities and talks to the applier only
# through files under ./state.
#
# Images are pinned to exact multi-arch releases. Secrets live in the
# mode-0600 files under ./tunnel and ./secrets, and the NetBird identity in the
# netbird-data volume; never print them or paste `docker compose config`
# output anywhere.
# Keep COMPOSE_PROJECT_NAME unchanged after the first start: it scopes the
# NetBird identity volume.
name: molebridge

services:
  wireguard:
    build:
      context: .
      dockerfile: routing/Dockerfile
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-wireguard"
    restart: unless-stopped
    # NET_ADMIN for routing and the tunnel. DAC_READ_SEARCH reads the tunnel
    # config when it belongs to your host user with mode 0600 (rootful
    # Docker); a rootless engine's container root is that user already.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /run:size=1m,mode=0755,noexec,nosuid,nodev
    # The entrypoint brings the tunnel down within 7 seconds of a stop; this
    # leaves room so the engine never cuts it short.
    stop_grace_period: 15s
    sysctls:
      # The namespace forwards overlay traffic into the tunnel.
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      # ICMP errors for tunnel traffic (fragmentation needed) are sourced from
      # the tunnel address so the priority-94 rule returns them through the
      # tunnel. Without it, path MTU discovery through the exit silently fails.
      net.ipv4.icmp_errors_use_inbound_ifaddr: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      OVERLAY_CIDR: "${OVERLAY_CIDR:?set OVERLAY_CIDR in .env (docs/configuration.md)}"
      OVERLAY6_CIDR: "${OVERLAY6_CIDR:-}"
      OVERLAY_IF: "${OVERLAY_IF:-wt0}"
      EXIT_IF: "${EXIT_IF:-mullvad}"
      EXIT_TABLE: "${EXIT_TABLE:-51821}"
      PROVIDER: "${PROVIDER:-mullvad}"
    volumes:
      # wg_confs/<EXIT_IF>.conf holds the tunnel private key (mode 0600).
      - ./tunnel/wg_confs:/config/wg_confs:ro
      # The owner record NetBird's gate and the applier check.
      - exit-run:/run/molebridge
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/molebridge-routing-ready && ip link show \"$$EXIT_IF\" >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # `json-file` with a size cap is the one bounded driver every supported
    # engine accepts. Docker's `local` driver does not exist under Podman, and
    # a container naming an unknown driver fails to create outright; Podman's
    # log options do not include `max-file`.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
    deploy:
      resources:
        limits:
          memory: 256m

  netbird:
    image: docker.io/netbirdio/netbird:0.80.0@sha256:4976692ea44bb93871743d0b742b4a8f97f6425bfc458ca2d78e28fdb8bdf4ad
    # This gate also runs on daemon/host restarts, which ignore depends_on. It
    # refuses NetBird settings Molebridge does not support (docs/configuration.md),
    # and stays in front of NetBird: it stops NetBird when the routing guards
    # or the exit's owner record go (routing/wait-for-guards).
    entrypoint: ["/bin/sh", "/usr/local/bin/molebridge-wait-for-guards", "/usr/local/bin/netbird-entrypoint.sh"]
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-netbird"
    restart: unless-stopped
    network_mode: service:wireguard
    # The gate stays in front of NetBird as its parent; an init reaps what it
    # leaves behind and passes signals on. It ends NetBird within 11 seconds
    # of a stop.
    init: true
    stop_grace_period: 15s
    # NetBird opens an IPv4 raw socket while bringing the overlay interface up.
    # Docker grants NET_RAW by default and Podman does not, where the engine
    # then fails with "failed to create ipv4 raw socket: operation not
    # permitted", the interface never appears, and the exit carries no traffic.
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      NB_INTERFACE_NAME: "${OVERLAY_IF:-wt0}"
      NB_HOSTNAME: "${NB_HOSTNAME:-molebridge-exit}"
      NB_MANAGEMENT_URL: "${NB_MANAGEMENT_URL:-https://api.netbird.io}"
      NB_LOG_LEVEL: info
      # This peer only forwards traffic; NetBird leaves the namespace's
      # resolver alone.
      NB_DISABLE_DNS: "true"
      # Part of Molebridge's supported NetBird configuration; the entrypoint
      # gate refuses to start without it.
      NB_DISABLE_USERSPACE_ROUTING: "true"
      # Keeps ICE off the exit tunnel interface from the peer's first
      # enrollment: NetBird binds this to `--extra-iface-blacklist` on the
      # first `netbird up`. An already enrolled peer keeps its stored
      # blacklist, so an upgrade sets it with the flag instead
      # (docs/setup.md#5-keep-ice-off-the-tunnel-interface).
      NB_EXTRA_IFACE_BLACKLIST: "${EXIT_IF:-mullvad}"
      # The gate checks the whole routing contract with the exit's settings.
      OVERLAY_CIDR: "${OVERLAY_CIDR:?set OVERLAY_CIDR in .env (docs/configuration.md)}"
      OVERLAY6_CIDR: "${OVERLAY6_CIDR:-}"
      EXIT_IF: "${EXIT_IF:-mullvad}"
      EXIT_TABLE: "${EXIT_TABLE:-51821}"
    env_file:
      # NB_SETUP_KEY, needed only until the peer first enrolls.
      - path: ./secrets/netbird.env
        required: false
    volumes:
      - ./routing/wait-for-guards:/usr/local/bin/molebridge-wait-for-guards:ro
      - ./routing/contract-rules:/usr/local/bin/molebridge-contract-rules:ro
      - exit-run:/run/molebridge:ro
      # Durable peer identity; deleting it re-enrolls as a new peer.
      - netbird-data:/var/lib/netbird
    depends_on:
      wireguard:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "netbird status 2>/dev/null | grep -q 'Management: Connected'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m

  applier:
    # Built from a pinned Python base with wg/ip/curl. This trusted component
    # owns the relay catalogue. NET_ADMIN can read the live interface key;
    # the tunnel configuration file is deliberately not mounted.
    build:
      context: .
      dockerfile: applier/Dockerfile
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-applier"
    restart: unless-stopped
    network_mode: service:wireguard
    cap_drop: [ALL]
    # NET_RAW supports interface binding on older kernels; DAC_OVERRIDE reads
    # mode-0600 requests and writes host-user-owned state directories.
    cap_add: [NET_ADMIN, NET_RAW, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      # curl's output lands here before it is parsed: room for the largest
      # server list any provider may send (NordVPN's, capped at 32 MiB). It
      # takes memory only while a download is there.
      - /tmp:size=48m,mode=1777,noexec,nosuid,nodev
    environment:
      EXIT_IF: "${EXIT_IF:-mullvad}"
      EXIT_TABLE: "${EXIT_TABLE:-51821}"
      PROVIDER: "${PROVIDER:-mullvad}"
      SERVER: "${SERVER:-}"
      # PIA only, off by default; see docs/providers.md#port-forwarding.
      PIA_PORT_FORWARD: "${PIA_PORT_FORWARD:-off}"
      PIA_PORT_FORWARD_TARGET: "${PIA_PORT_FORWARD_TARGET:-}"
      OVERLAY_IF: "${OVERLAY_IF:-wt0}"
      OVERLAY_CIDR: "${OVERLAY_CIDR:?set OVERLAY_CIDR in .env}"
      OVERLAY6_CIDR: "${OVERLAY6_CIDR:-}"
      GATUS_URL: "${GATUS_URL:-}"
      GATUS_ENDPOINT: "${GATUS_ENDPOINT:-molebridge}"
    env_file:
      # Optional GATUS_TOKEN for health pushes.
      - path: ./secrets/applier.env
        required: false
    volumes:
      - ./state/panel:/state/panel:ro
      - ./state/applier:/state/applier
      # The wireguard container's owner record: the applier counts routing
      # as safe only while it is live (molebridge/routing.py).
      - exit-run:/run/molebridge:ro
    depends_on:
      wireguard:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "python", "-m", "applier.apply", "--healthcheck"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128m

  control-panel:
    image: docker.io/library/python:3.14.7-slim@sha256:caaf356f40667c496d405780745b9ac25771c189a51dfcc42430d531ea09f8a2
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-control-panel"
    restart: unless-stopped
    # The user that owns ./state/panel, as the container sees it. Keep it equal
    # to your host user's uid:gid on an engine that maps container uids to host
    # uids directly.
    # Under a rootless engine that remaps them, container root is already the
    # host user and an unmapped uid cannot read the 0700 state tree; set
    # PANEL_USER=0:0 there. See docs/configuration.md.
    user: "${PANEL_USER:-1000:1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    working_dir: /app
    command: ["python", "/app/panel/app.py"]
    environment:
      STATE_DIR: /state
      PROVIDER: "${PROVIDER:-mullvad}"
      PYTHONDONTWRITEBYTECODE: "1"
      PANEL_PUBLIC_HOSTS: "${PANEL_PUBLIC_HOSTS:-}"
      PANEL_FRAME_ANCESTORS: "${PANEL_FRAME_ANCESTORS:-}"
      PANEL_TITLE: "${PANEL_TITLE:-Switchyard}"
      PANEL_SHORT_TITLE: "${PANEL_SHORT_TITLE:-Switchyard}"
      PANEL_HOST_LABEL: "${PANEL_HOST_LABEL:-this exit}"
      PANEL_HOME_URL: "${PANEL_HOME_URL:-}"
      PANEL_HOME_LABEL: "${PANEL_HOME_LABEL:-Home}"
      PANEL_THEME: "${PANEL_THEME:-auto}"
      PANEL_STYLE: "${PANEL_STYLE:-provider}"
      # Optional sign-in; empty PANEL_OIDC_ISSUER means no login. See docs/access.md.
      PANEL_OIDC_ISSUER: "${PANEL_OIDC_ISSUER:-}"
      PANEL_OIDC_CLIENT_ID: "${PANEL_OIDC_CLIENT_ID:-}"
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:-}"
      PANEL_ADMIN_GROUPS: "${PANEL_ADMIN_GROUPS:-}"
      PANEL_SESSION_TTL: "${PANEL_SESSION_TTL:-3600}"
    ports:
      # Loopback only. Publish it through an authenticating proxy, or through
      # a proxy with sign-in (PANEL_OIDC_ISSUER above) turned on.
      - "127.0.0.1:${PANEL_PORT:-8095}:8080"
    volumes:
      - ./panel:/app/panel:ro
      - ./molebridge:/app/molebridge:ro
      - ./state/panel:/state/panel
      - ./state/applier:/state/applier:ro
    networks: [panel]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  panel:

volumes:
  netbird-data:
  # The wireguard container's owner record (routing/molebridge-exit).
  exit-run:
