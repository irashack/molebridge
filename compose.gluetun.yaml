# Molebridge with gluetun as the tunnel backend. EXPERIMENTAL; see
# docs/gluetun-netbird-exit.md, and docs/testing.md#080 for what was tested.
#
# Use this file instead of compose.yaml, not on top of it:
#   COMPOSE_FILE=compose.gluetun.yaml   (in .env)
# with the settings from .env.gluetun.example and
# docs/configuration.md#gluetun-backend.
#
# Namespace ownership: `gluetun` creates the network namespace, its firewall
# and the provider tunnel (EXIT_IF). `exit` joins it (`network_mode:
# service:gluetun`): it installs Molebridge's routing contract and keeps it in
# place while gluetun recreates its interface on every reconnect, starts
# NetBird only after the contract holds, and switches servers through
# gluetun's control server. If `gluetun` is recreated, `exit` can remain in
# its old namespace: recreate both together (`docker compose up -d
# --force-recreate`, docs/operations.md). `switchyard` is the web panel; it
# shares no network with either and reads the exit's files under ./state.
#
# Secrets live in mode-0600 files under ./secrets/gluetun; never print them
# or paste `docker compose config` output anywhere. The control server's API
# key is full gluetun administration: only gluetun (in its role file) and the
# exit mount it, never the panel.
name: molebridge

services:
  gluetun:
    image: docker.io/qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-gluetun"
    # Checks the control-server role file on every start, then runs gluetun's
    # own entrypoint: gluetun would log an excerpt of a malformed role file,
    # API key included (routing/gluetun-preflight). MOLEBRIDGE_KIND below
    # tells it which kind of exit this is.
    entrypoint: ["/bin/sh", "/usr/local/bin/molebridge-gluetun-preflight", "/gluetun-entrypoint"]
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      # The namespace forwards overlay traffic into the tunnel.
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      # ICMP errors for tunnel traffic are sourced from the tunnel address so
      # the priority-94 rule returns them through the tunnel.
      net.ipv4.icmp_errors_use_inbound_ifaddr: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      VPN_SERVICE_PROVIDER: "${GLUETUN_PROVIDER:?set GLUETUN_PROVIDER in .env (docs/configuration.md#gluetun-backend)}"
      VPN_TYPE: wireguard
      # gluetun's values are auto, userspace and kernelspace; kernelspace
      # fails instead of falling back to a userspace tunnel.
      WIREGUARD_IMPLEMENTATION: kernelspace
      # gluetun's image defaults this to tun0; the exit and NetBird's ICE
      # blacklist must name the same interface.
      VPN_INTERFACE: "${EXIT_IF:-wg0}"
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard_private_key
      WIREGUARD_ADDRESSES: "${GLUETUN_WIREGUARD_ADDRESSES:-}"
      SERVER_COUNTRIES: "${GLUETUN_SERVER_COUNTRIES:-}"
      SERVER_CITIES: "${GLUETUN_SERVER_CITIES:-}"
      SERVER_HOSTNAMES: "${GLUETUN_SERVER_HOSTNAMES:-}"
      # gluetun's server list, in a directory of its own so the exit can
      # mount only that, read-only. The updater refreshes it; the panel shows
      # the provider data's date and calls it stale after 30 days.
      STORAGE_FILEPATH: /gluetun/servers/servers.json
      UPDATER_PERIOD: "${GLUETUN_UPDATER_PERIOD:-24h}"
      # NetBird's WireGuard port, opened in gluetun's INPUT chain on the host
      # interface; the post-rules open it too.
      FIREWALL_INPUT_PORTS: "${NB_WIREGUARD_PORT:-51820}"
      # Namespace loopback only, never published. Its credential is full
      # gluetun administration; the role file decides which routes answer.
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
      # An overlay exit: the preflight requires the post-rules file mounted
      # below, which the sidecar form must not have (compose.sidecar.yaml sets
      # `sidecar`). Anything else keeps gluetun from starting.
      MOLEBRIDGE_KIND: overlay
    volumes:
      - gluetun-data:/gluetun
      - gluetun-servers:/gluetun/servers
      - ./routing/gluetun-preflight:/usr/local/bin/molebridge-gluetun-preflight:ro
      # These three must exist: Compose then fails instead of creating an
      # empty directory in their place. Without its role file gluetun would
      # answer several routes with no authentication, including PUT
      # /v1/vpn/status.
      # secrets/gluetun/wireguard_private_key: the provider key, one line, mode 0600.
      - type: bind
        source: ./secrets/gluetun/wireguard_private_key
        target: /run/secrets/wireguard_private_key
        read_only: true
        bind:
          create_host_path: false
      # secrets/gluetun/auth.toml: control-server roles, mode 0600, written
      # by the `gluetun-auth` tool (docs/operations.md).
      - type: bind
        source: ./secrets/gluetun/auth.toml
        target: /gluetun/auth/config.toml
        read_only: true
        bind:
          create_host_path: false
      # Written by the `gluetun-post-rules` tool (docs/operations.md); the
      # preflight refuses to start gluetun without it.
      - type: bind
        source: ./tunnel/gluetun/post-rules.txt
        target: /iptables/post-rules.txt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
    deploy:
      resources:
        limits:
          memory: 256m

  exit:
    # The image from compose.yaml, in its gluetun form (TUNNEL_BACKEND=gluetun):
    # one container where 0.7.0 had `guard`, `netbird` and `applier`. It
    # installs Molebridge's routing contract in gluetun's namespace and keeps
    # it in place while gluetun recreates its interface on every reconnect,
    # starts NetBird only once the contract holds and stops it, under a lease,
    # if the contract or NetBird's control-traffic marking fails, and switches
    # servers through gluetun's control server on the namespace's loopback,
    # then verifies the peer, the handshake, the contract and egress. It
    # never removes the unreachable fallback or rules 1 and 97, and on a
    # stop it removes only NetBird's overlay interface, never gluetun's
    # tunnel. NET_ADMIN as with the native exit; the API key is full gluetun
    # administration, part of the same trusted base.
    image: ghcr.io/irashack/molebridge:v0.9.2@sha256:f91787689be0600ce2de248b6c6f329872cd66d3dd8c1e090b38abb12b29d98b
    # Only for people who build from a checkout, with a local image name in
    # compose.override.yaml (CONTRIBUTING.md#building-the-image); the release
    # bundle has no Dockerfile and pulls the image instead.
    build:
      context: .
      dockerfile: Dockerfile
    command: ["exit"]
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-exit"
    restart: unless-stopped
    network_mode: service:gluetun
    cap_drop: [ALL]
    # NET_RAW: NetBird opens an IPv4 raw socket while bringing the overlay
    # interface up (Podman does not grant it by default), and interface
    # binding on older kernels needs it. DAC_OVERRIDE reads mode-0600 files
    # and panel requests, and writes host-user-owned state directories.
    cap_add: [NET_ADMIN, NET_RAW, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      # The supervisor's runtime files and NetBird's control socket.
      - /run:size=4m,mode=0755,noexec,nosuid,nodev
      # NetBird's client log, kept off the read-only root; the exit reads its
      # own launch's lines from it to detect NetBird's fallback from advanced
      # routing.
      - /var/log/netbird:size=16m,mode=0755,noexec,nosuid,nodev
    stop_grace_period: 15s
    environment:
      TZ: "${TZ:-Etc/UTC}"
      TUNNEL_BACKEND: gluetun
      EXIT_KIND: overlay
      PROVIDER: "gluetun-${GLUETUN_PROVIDER:?set GLUETUN_PROVIDER in .env (docs/configuration.md#gluetun-backend)}"
      EXIT_IF: "${EXIT_IF:-wg0}"
      EXIT_TABLE: "${EXIT_TABLE:-51821}"
      OVERLAY_IF: "${OVERLAY_IF:-wt0}"
      OVERLAY_CIDR: "${OVERLAY_CIDR:?set OVERLAY_CIDR in .env (docs/configuration.md)}"
      OVERLAY6_CIDR: "${OVERLAY6_CIDR:-}"
      HOST_IF: "${HOST_IF:-eth0}"
      HOST_TABLE: "${HOST_TABLE:-51822}"
      CONTROL_MARK: "${CONTROL_MARK:-0x1bd00}"
      SERVER: "${SERVER:-}"
      GLUETUN_CONTROL_URL: http://127.0.0.1:8000
      GLUETUN_API_KEY_FILE: /run/secrets/gluetun/api_key
      GLUETUN_SERVERS_FILE: /gluetun-servers/servers.json
      # The exit starts one refresh of the list at start when the data is
      # older than this period or than 7 days; 0 means never.
      GLUETUN_UPDATER_PERIOD: "${GLUETUN_UPDATER_PERIOD:-24h}"
      GATUS_URL: "${GATUS_URL:-}"
      GATUS_ENDPOINT: "${GATUS_ENDPOINT:-molebridge}"
      STATE_DIR: /state
      # Overrides whose defaults live in the binary (docs/configuration.md).
      # Seconds between full repair passes, 2 to 60; netlink events repair in
      # between. Seconds without an accepted lease renewal before the
      # supervisor stops NetBird, 5 to 30. And seconds NetBird may go without
      # carrying the control-plane mark before it is stopped, 5 to 30.
      ROUTING_RECONCILE_INTERVAL: "${ROUTING_RECONCILE_INTERVAL:-30}"
      GUARD_GRACE: "${GUARD_GRACE:-30}"
      FWMARK_GRACE: "${FWMARK_GRACE:-30}"
      # NetBird, as the old netbird service set it.
      NB_INTERFACE_NAME: "${OVERLAY_IF:-wt0}"
      NB_HOSTNAME: "${NB_HOSTNAME:-molebridge-exit}"
      NB_MANAGEMENT_URL: "${NB_MANAGEMENT_URL:-https://api.netbird.io}"
      NB_LOG_LEVEL: info
      NB_DISABLE_DNS: "true"
      NB_DISABLE_USERSPACE_ROUTING: "true"
      NB_EXTRA_IFACE_BLACKLIST: "${EXIT_IF:-wg0}"
      NB_WIREGUARD_PORT: "${NB_WIREGUARD_PORT:-51820}"
      # The control-plane mark rules 88/89 match. NetBird takes its base from
      # NB_FWMARK_BASE; the exit refuses to start NetBird unless the two are
      # equal.
      NB_FWMARK_BASE: "${CONTROL_MARK:-0x1bd00}"
    env_file:
      # NB_SETUP_KEY, needed only until the peer first enrolls.
      - path: ./secrets/netbird.env
        required: false
      # Optional GATUS_TOKEN for health pushes.
      - path: ./secrets/applier.env
        required: false
    volumes:
      - ./state/panel:/state/panel:ro
      - ./state/applier:/state/applier
      # Only the directory of gluetun's server list, read-only.
      - gluetun-servers:/gluetun-servers:ro
      # The API key from the `gluetun-auth` tool, mode 0600.
      - type: bind
        source: ./secrets/gluetun/api_key
        target: /run/secrets/gluetun/api_key
        read_only: true
        bind:
          create_host_path: false
      # Durable peer identity; deleting it re-enrolls as a new peer.
      - netbird-data:/var/lib/netbird
    depends_on:
      gluetun:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/molebridge", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging
    deploy:
      resources:
        limits:
          # NetBird (256m in 0.7.0) and gluetun's server list for every
          # provider, about 7.5 MB of JSON parsed whole when it changes (the
          # applier had 384m); the guard had 64m.
          memory: 512m

  switchyard:
    # compose.yaml's panel, for this exit's gluetun provider.
    extends:
      file: compose.yaml
      service: switchyard
    environment:
      PROVIDER: "gluetun-${GLUETUN_PROVIDER:?set GLUETUN_PROVIDER in .env (docs/configuration.md#gluetun-backend)}"

networks:
  panel:

volumes:
  netbird-data:
  gluetun-data:
  gluetun-servers:
