# Molebridge with gluetun as the tunnel backend. EXPERIMENTAL: one live pass,
# with NordVPN on Docker; see docs/architecture.md#gluetun-backend and
# docs/testing.md#gluetun-backend-pass-at-a3bb14f.
#
# Use this file instead of compose.yaml, not on top of it:
#   COMPOSE_FILE=compose.gluetun.yaml   (in .env)
# with the gluetun settings from .env.example and docs/configuration.md#gluetun-backend.
#
# Namespace ownership: `gluetun` creates the network namespace, its firewall
# and the provider tunnel (EXIT_IF). `guard`, `netbird` and `applier` join it
# (`network_mode: service:gluetun`). `guard` installs Molebridge's routing
# contract and keeps it in place while gluetun recreates its interface on
# every reconnect; `netbird` starts only through the gate, after the guard is
# ready; `applier` switches servers through gluetun's control server. If
# `gluetun` is recreated, the others can remain in its old namespace:
# recreate them together (tools/molebridge.py recover on Docker).
#
# Secrets live in mode-0600 files under ./secrets/gluetun; never print them
# or paste `docker compose config` output anywhere. The control server's API
# key is full gluetun administration: only gluetun (in its role file) and the
# applier mount it, never the panel.
name: molebridge

services:
  gluetun:
    image: docker.io/qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-gluetun"
    # Checks the control-server role file on every start, then runs gluetun's
    # own entrypoint: gluetun would log an excerpt of a malformed role file,
    # API key included (routing/gluetun-preflight).
    entrypoint: ["/bin/sh", "/usr/local/bin/molebridge-gluetun-preflight", "/gluetun-entrypoint"]
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      # The namespace forwards overlay traffic into the tunnel.
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      # ICMP errors for tunnel traffic are sourced from the tunnel address so
      # the priority-94 rule returns them through the tunnel.
      net.ipv4.icmp_errors_use_inbound_ifaddr: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      VPN_SERVICE_PROVIDER: "${GLUETUN_PROVIDER:?set GLUETUN_PROVIDER in .env (docs/configuration.md#gluetun-backend)}"
      VPN_TYPE: wireguard
      # gluetun's values are auto, userspace and kernelspace; kernelspace
      # fails instead of falling back to a userspace tunnel.
      WIREGUARD_IMPLEMENTATION: kernelspace
      # gluetun's image defaults this to tun0; the guard and NetBird's ICE
      # blacklist must name the same interface.
      VPN_INTERFACE: "${EXIT_IF:-wg0}"
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard_private_key
      WIREGUARD_ADDRESSES: "${GLUETUN_WIREGUARD_ADDRESSES:-}"
      SERVER_COUNTRIES: "${GLUETUN_SERVER_COUNTRIES:-}"
      SERVER_CITIES: "${GLUETUN_SERVER_CITIES:-}"
      SERVER_HOSTNAMES: "${GLUETUN_SERVER_HOSTNAMES:-}"
      # gluetun's server list, in a directory of its own so the applier can
      # mount only that, read-only. The updater refreshes it; the panel shows
      # the provider data's date and calls it stale after 30 days.
      STORAGE_FILEPATH: /gluetun/servers/servers.json
      UPDATER_PERIOD: "${GLUETUN_UPDATER_PERIOD:-24h}"
      # NetBird's WireGuard port, opened in gluetun's INPUT chain on the host
      # interface; the post-rules open it too.
      FIREWALL_INPUT_PORTS: "${NB_WIREGUARD_PORT:-51820}"
      # Namespace loopback only, never published. Its credential is full
      # gluetun administration; the role file decides which routes answer.
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
    volumes:
      - gluetun-data:/gluetun
      - gluetun-servers:/gluetun/servers
      - ./routing/gluetun-preflight:/usr/local/bin/molebridge-gluetun-preflight:ro
      # These three must exist: Compose then fails instead of creating an
      # empty directory in their place. Without its role file gluetun would
      # answer several routes with no authentication, including PUT
      # /v1/vpn/status.
      # secrets/gluetun/wireguard_private_key: the provider key, one line, mode 0600.
      - type: bind
        source: ./secrets/gluetun/wireguard_private_key
        target: /run/secrets/wireguard_private_key
        read_only: true
        bind:
          create_host_path: false
      # secrets/gluetun/auth.toml: control-server roles, mode 0600, written
      # by `python3 tools/molebridge.py gluetun-auth`.
      - type: bind
        source: ./secrets/gluetun/auth.toml
        target: /gluetun/auth/config.toml
        read_only: true
        bind:
          create_host_path: false
      # Written by `python3 tools/molebridge.py gluetun-post-rules`.
      - type: bind
        source: ./tunnel/gluetun/post-rules.txt
        target: /iptables/post-rules.txt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
    deploy:
      resources:
        limits:
          memory: 256m

  guard:
    # The routing image from compose.yaml, run as a long-lived sidecar instead
    # of its LinuxServer init: install the contract, then reconcile every few
    # seconds. It never removes the unreachable fallback or rules 1 and 97.
    build:
      context: .
      dockerfile: routing/Dockerfile
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-guard"
    restart: unless-stopped
    network_mode: service:gluetun
    entrypoint: ["/bin/sh", "/custom-cont-init.d/10-exit-routing"]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777,noexec,nosuid,nodev
    environment:
      TUNNEL_BACKEND: gluetun
      OVERLAY_CIDR: "${OVERLAY_CIDR:?set OVERLAY_CIDR in .env (docs/configuration.md)}"
      OVERLAY6_CIDR: "${OVERLAY6_CIDR:-}"
      OVERLAY_IF: "${OVERLAY_IF:-wt0}"
      EXIT_IF: "${EXIT_IF:-wg0}"
      EXIT_TABLE: "${EXIT_TABLE:-51821}"
      HOST_IF: "${HOST_IF:-eth0}"
      HOST_TABLE: "${HOST_TABLE:-51822}"
      CONTROL_MARK: "${CONTROL_MARK:-0x1bd00}"
      ROUTING_READY_FILE: /run/molebridge/routing-ready
      # NetBird's gate reads the overlay interface's fwmark from here.
      GUARD_STATUS_FILE: /run/molebridge/overlay-fwmark
    volumes:
      - guard-run:/run/molebridge
    depends_on:
      gluetun:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/molebridge/routing-ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64m

  netbird:
    image: docker.io/netbirdio/netbird:0.79.0@sha256:9d8480d87b7f7c10d67b820eecf332ecca5c2756792d4bdfa532182b4fc3005f
    # In gluetun mode the gate stays in front of NetBird: it refuses settings
    # that unmark NetBird's control traffic, waits for the guard's rules, and
    # stops NetBird, exiting non-zero, if marking turns out to be off.
    entrypoint: ["/bin/sh", "/usr/local/bin/molebridge-wait-for-guards", "/usr/local/bin/netbird-entrypoint.sh"]
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-netbird"
    restart: unless-stopped
    network_mode: service:gluetun
    cap_add: [NET_ADMIN, NET_RAW]
    # The gate stays in front of NetBird as its parent; an init reaps what it
    # leaves behind and passes signals on.
    init: true
    environment:
      TUNNEL_BACKEND: gluetun
      NB_INTERFACE_NAME: "${OVERLAY_IF:-wt0}"
      NB_HOSTNAME: "${NB_HOSTNAME:-molebridge-exit}"
      NB_MANAGEMENT_URL: "${NB_MANAGEMENT_URL:-https://api.netbird.io}"
      NB_LOG_LEVEL: info
      NB_DISABLE_DNS: "true"
      NB_DISABLE_USERSPACE_ROUTING: "true"
      NB_EXTRA_IFACE_BLACKLIST: "${EXIT_IF:-wg0}"
      NB_WIREGUARD_PORT: "${NB_WIREGUARD_PORT:-51820}"
      # The control-plane mark rules 88/89 match. NetBird takes its base from
      # NB_FWMARK_BASE; the gate requires the two to be equal.
      CONTROL_MARK: "${CONTROL_MARK:-0x1bd00}"
      NB_FWMARK_BASE: "${CONTROL_MARK:-0x1bd00}"
      # The gate checks the whole guard with the guard's own settings.
      OVERLAY_CIDR: "${OVERLAY_CIDR:?set OVERLAY_CIDR in .env (docs/configuration.md)}"
      OVERLAY6_CIDR: "${OVERLAY6_CIDR:-}"
      EXIT_IF: "${EXIT_IF:-wg0}"
      EXIT_TABLE: "${EXIT_TABLE:-51821}"
      HOST_IF: "${HOST_IF:-eth0}"
      HOST_TABLE: "${HOST_TABLE:-51822}"
      GUARD_STATUS_FILE: /run/molebridge/overlay-fwmark
    env_file:
      # NB_SETUP_KEY, needed only until the peer first enrolls.
      - path: ./secrets/netbird.env
        required: false
    volumes:
      - ./routing/wait-for-guards:/usr/local/bin/molebridge-wait-for-guards:ro
      - ./routing/gluetun-rules:/usr/local/bin/molebridge-gluetun-rules:ro
      - netbird-data:/var/lib/netbird
      - guard-run:/run/molebridge:ro
    depends_on:
      gluetun:
        condition: service_started
        restart: true
      guard:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "netbird status 2>/dev/null | grep -q 'Management: Connected'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m

  applier:
    # The applier from compose.yaml, for gluetun: it reads gluetun's server
    # list (read-only, never downloaded) and selects servers through gluetun's
    # control server on the namespace's loopback, then verifies the peer, the
    # handshake, the guards and egress. NET_ADMIN as with the default backend;
    # the API key is full gluetun administration, part of the same trusted base.
    build:
      context: .
      dockerfile: applier/Dockerfile
    container_name: "${COMPOSE_PROJECT_NAME:-molebridge}-applier"
    restart: unless-stopped
    network_mode: service:gluetun
    cap_drop: [ALL]
    # NET_RAW supports interface binding on older kernels; DAC_OVERRIDE reads
    # mode-0600 files and writes host-user-owned state directories.
    cap_add: [NET_ADMIN, NET_RAW, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    environment:
      TUNNEL_BACKEND: gluetun
      PROVIDER: "gluetun-${GLUETUN_PROVIDER:?set GLUETUN_PROVIDER in .env (docs/configuration.md#gluetun-backend)}"
      EXIT_IF: "${EXIT_IF:-wg0}"
      EXIT_TABLE: "${EXIT_TABLE:-51821}"
      OVERLAY_IF: "${OVERLAY_IF:-wt0}"
      OVERLAY_CIDR: "${OVERLAY_CIDR:?set OVERLAY_CIDR in .env (docs/configuration.md)}"
      OVERLAY6_CIDR: "${OVERLAY6_CIDR:-}"
      HOST_IF: "${HOST_IF:-eth0}"
      HOST_TABLE: "${HOST_TABLE:-51822}"
      CONTROL_MARK: "${CONTROL_MARK:-0x1bd00}"
      SERVER: "${SERVER:-}"
      GLUETUN_CONTROL_URL: http://127.0.0.1:8000
      GLUETUN_API_KEY_FILE: /run/secrets/gluetun/api_key
      GLUETUN_SERVERS_FILE: /gluetun-servers/servers.json
      # The applier starts one refresh of the list at start when the data is
      # older than this period or than 7 days; 0 means never.
      GLUETUN_UPDATER_PERIOD: "${GLUETUN_UPDATER_PERIOD:-24h}"
      GATUS_URL: "${GATUS_URL:-}"
      GATUS_ENDPOINT: "${GATUS_ENDPOINT:-molebridge}"
    env_file:
      # Optional GATUS_TOKEN for health pushes.
      - path: ./secrets/applier.env
        required: false
    volumes:
      - ./state/panel:/state/panel:ro
      - ./state/applier:/state/applier
      # Only the directory of gluetun's server list, read-only.
      - gluetun-servers:/gluetun-servers:ro
      # The API key from `tools/molebridge.py gluetun-auth`, mode 0600.
      - type: bind
        source: ./secrets/gluetun/api_key
        target: /run/secrets/gluetun/api_key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      gluetun:
        condition: service_started
        restart: true
      guard:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "python", "-m", "applier.apply", "--healthcheck"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          # gluetun's server list for every provider is about 7.5 MB of
          # JSON, parsed whole when it changes.
          memory: 384m

  control-panel:
    extends:
      file: compose.yaml
      service: control-panel
    environment:
      PROVIDER: "gluetun-${GLUETUN_PROVIDER:?set GLUETUN_PROVIDER in .env (docs/configuration.md#gluetun-backend)}"

networks:
  panel:

volumes:
  netbird-data:
  gluetun-data:
  gluetun-servers:
  guard-run:
